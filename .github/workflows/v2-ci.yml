name: Hindi To Lat v2 CI

on:
  push:
    branches: [ "v2-development" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "7.4", "8.1", "8.3" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Transliteration regression tests
        run: php tests/transliterator-smoke.php
